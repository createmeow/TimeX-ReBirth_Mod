# This is an example neoforge.mods.toml file. It contains the data relating to the loading mods.
# There are several mandatory fields (#mandatory), and many more that are optional (#optional).
# The overall format is standard TOML format, v0.5.0.
# Note that there are a couple of TOML lists in this file.
# Find more information on toml format here:  https://github.com/toml-lang/toml

# The name of the mod loader type to load - for regular FML @Mod mods it should be javafml
modLoader="javafml" #mandatory

# A version range to match for said mod loader - for regular FML @Mod it will be the FML version. This is currently 2.
loaderVersion="${loader_version_range}" #mandatory

# The license for you mod. This is mandatory metadata and allows for easier comprehension of your redistributive properties.
# Review your options at https://choosealicense.com/. All rights reserved is the default copyright stance, and is thus the default here.
license="${mod_license}"

# A URL to refer people to when problems occur with this mod
#issueTrackerURL="https://change.me.to.your.issue.tracker.example.invalid/" #optional

# A list of mods - how many allowed here is determined by the individual mod loader
[[mods]] #mandatory

# The modid of the mod
modId="${mod_id}" #mandatory

# The version number of the mod
version="${mod_version}" #mandatory

# A display name for the mod
displayName="${mod_name}" #mandatory

# A URL to query for updates for this mod. See the JSON update specification https://docs.neoforged.net/docs/misc/updatechecker/
#updateJSONURL="https://change.me.example.invalid/updates.json" #optional

# A URL for the "homepage" for this mod, displayed in the mod UI
#displayURL="https://change.me.to.your.mods.homepage.example.invalid/" #optional

# A file name (in the root of the mod JAR) containing a logo for display
#logoFile="examplemod.png" #optional

# A text field displayed in the mod UI
#credits="" #optional

# The authors of the mod, displayed in the mod UI (optional)
authors="createmeow"

# The description text for the mod (multi line!) (#mandatory)
description='''
TimeX：Rebirth Main Mod
'''

# The [[mixins]] block allows you to declare your mixin config to FML so that it gets loaded.
[[mixins]]
config="${mod_id}.mixins.json"

# The [[accessTransformers]] block allows you to declare where your AT file is.
# If this block is omitted, a fallback attempt will be made to load an AT from META-INF/accesstransformer.cfg
#[[accessTransformers]]
#file="META-INF/accesstransformer.cfg"

# The coremods config file path is not configurable and is always loaded from META-INF/coremods.json

# A dependency - use the . to indicate dependency for a specific modid. Dependencies are optional.
[[dependencies.${mod_id}]] #optional
    # the modid of the dependency
    modId="neoforge" #mandatory
    # The type of the dependency. Can be one of "required", "optional", "incompatible" or "discouraged" (case insensitive).
    # 'required' requires the mod to exist, 'optional' does not
    # 'incompatible' will prevent the game from loading when the mod exists, and 'discouraged' will show a warning
    type="required" #mandatory
    # Optional field describing why the dependency is required or why it is incompatible
    # reason="..."
    # The version range of the dependency
    versionRange="[${neo_version},)" #mandatory
    # An ordering relationship for the dependency.
    # BEFORE - This mod is loaded BEFORE the dependency
    # AFTER - This mod is loaded AFTER the dependency
    ordering="NONE"
    # Side this dependency is applied on - BOTH, CLIENT, or SERVER
    side="BOTH"

# Here's another dependency
[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    # This version range declares a minimum of the current minecraft version up to but not including the next major version
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Optional dependency on Corpse mod for death history integration
[[dependencies.${mod_id}]]
    modId="corpse"
    type="optional"
    ordering="NONE"
    side="CLIENT"

# Optional dependency on Xaero's Minimap for temporary waypoint integration
[[dependencies.${mod_id}]]
    modId="xaerominimap"
    type="optional"
    ordering="NONE"
    side="CLIENT"

# Optional dependency on Xaero's World Map for map integration
[[dependencies.${mod_id}]]
    modId="xaeroworldmap"
    type="optional"
    ordering="NONE"
    side="CLIENT"

# Optional dependency on Cold Sweat for temperature-driven features
[[dependencies.${mod_id}]]
    modId="cold_sweat"
    type="optional"
    ordering="NONE"
    side="BOTH"

# Optional dependency on Immersive Weathering for permafrost blocks
[[dependencies.${mod_id}]]
    modId="immersive_weathering"
    type="optional"
    ordering="NONE"
    side="BOTH"

# Optional dependency on Farmer's Delight for crop seeds
# AFTER：本模组在其之后加载，使其覆盖食物/面团等配方的数据包层叠优先于农夫乐事
[[dependencies.${mod_id}]]
    modId="farmersdelight"
    type="optional"
    ordering="AFTER"
    side="BOTH"

# Required dependency on Freeze-It-And-Heat-It for food freezing/rotting system
[[dependencies.${mod_id}]]
    modId="fiahi"
    type="required"
    ordering="NONE"
    side="BOTH"

# Optional dependency on RealityValue for sanity linkage (frozen/rotten food penalties)
[[dependencies.${mod_id}]]
    modId="reality_value"
    type="optional"
    ordering="NONE"
    side="BOTH"

# Optional dependency on BaseCore for base heating (heat bridge module / receiver)
[[dependencies.${mod_id}]]
    modId="basecore"
    type="optional"
    ordering="NONE"
    side="BOTH"

# Optional dependency on Create for heat flux pipe transport
# AFTER：本模组在其之后加载，使数据包覆盖（如水+面粉→面团改为农夫乐事面团）优先于机械动力
[[dependencies.${mod_id}]]
    modId="create"
    type="optional"
    ordering="AFTER"
    side="BOTH"

# Optional dependency on JEI for the drawing table recipe category
[[dependencies.${mod_id}]]
    modId="jei"
    type="optional"
    ordering="NONE"
    side="CLIENT"

# Optional dependency on EMI for the drawing table recipe category
[[dependencies.${mod_id}]]
    modId="emi"
    type="optional"
    ordering="NONE"
    side="CLIENT"

# ============================================================================
# cm_plugins - Second mod in this JAR
# ============================================================================
[[mods]]
modId="${cm_plugins_id}"
version="${cm_plugins_version}"
displayName="${cm_plugins_name}"
authors="createmeow"
description='''
createmeow's plugins, but in NeoForge!
Features: Random Zombie Health + No Mob Spawn + Spatial Inventory + Combat Log Punishment
'''

# cm_plugins dependencies
[[dependencies.${cm_plugins_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${cm_plugins_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Optional dependency on NumismaticOverhaul for currency system
[[dependencies.${cm_plugins_id}]]
    modId="numismaticoverhaul"
    type="optional"
    ordering="NONE"
    side="BOTH"

# Optional dependency on Corpse mod for coin consolidation
[[dependencies.${cm_plugins_id}]]
    modId="corpse"
    type="optional"
    ordering="NONE"
    side="BOTH"

# ============================================================================
# night_vision_device - Third mod in this JAR
# ============================================================================
[[mods]]
modId="${night_vision_device_id}"
version="${night_vision_device_version}"
displayName="${night_vision_device_name}"
authors="createmeow"
description='''
A mod that adds a night vision device helmet.
Provides night vision effect when worn and a visual overlay like pumpkin.
'''

# night_vision_device dependencies
[[dependencies.${night_vision_device_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${night_vision_device_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# ============================================================================
# underwater_plugin - Fourth mod in this JAR
# ============================================================================
[[mods]]
modId="${underwater_plugin_id}"
version="${underwater_plugin_version}"
displayName="${underwater_plugin_name}"
authors="createmeow"
description='''
水下探索插件：溺水值系统、过深耗氧飙升（BetterDiving 机制）、深度加权溺水伤害、
Cold Sweat 深度温度削减（每下潜 1 格环境温度额外 -2）。
Underwater exploration: drowning value, depth-based oxygen drain (BetterDiving style),
stronger drowning damage and Cold Sweat depth temperature drop.
'''

# underwater_plugin dependencies
[[dependencies.${underwater_plugin_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${underwater_plugin_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Optional dependency on Create for diving equipment air drain (backtank over-depth usage)
[[dependencies.${underwater_plugin_id}]]
    modId="create"
    type="optional"
    ordering="NONE"
    side="BOTH"

# Optional dependency on Cold Sweat for depth-based temperature drop
[[dependencies.${underwater_plugin_id}]]
    modId="cold_sweat"
    type="optional"
    ordering="NONE"
    side="BOTH"

# Features are specific properties of the game environment, that you may want to declare you require. This example declares
# that your mod requires GL version 3.2 or higher. Other features will be added. They are side aware so declaring this won't
# stop your mod loading on the server for example.
#[features.${mod_id}]
#openGLVersion="[3.2,)"
