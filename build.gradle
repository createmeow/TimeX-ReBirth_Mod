plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files

    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    // Add here additional repositories if required by some of the dependencies below.
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG

            // owo-lib 在开发环境默认开启 DEBUG，其 LevelInfoMixin 会把新建存档的
            // doDaylightCycle / doWeatherCycle 强制设为 false（白天黑夜与天气不再变化）。
            // 开发测试需要正常的时间流逝，这里显式关闭 owo 调试模式。
            systemProperty 'owo.debug', 'false'
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        // cm_plugins - second mod in this JAR
        "${project.cm_plugins_id}" {
            sourceSet(sourceSets.main)
        }
        // night_vision_device - third mod in this JAR
        "${project.night_vision_device_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // NumismaticOverhaul currency system is compiled from source
    // The jar is created by createNumismaticJar task and added to classpath below

    // Immersive Weathering: compile-only reference for the mixin targeting
    // BlockGrowthHandler.tickBlock (TickSource parameter type). The mod itself
    // is loaded from the mods folder at runtime, so this is never bundled.
    compileOnly files("D:/MODS/已构建/Immersive-weathering-V1.0.4-neoforge-beta.jar")

    // Freeze-It-And-Heat-It (fiahi): compile-only reference for ApplySpecialEatEffectEvent
    // and IFrozenRottenFood. Required at runtime (declared in neoforge.mods.toml).
    compileOnly files("D:/MODS/已构建/fiahi-4.1.0.jar")

    // BaseCore: compile-only for base core module/upgrade API (HeatBridgeModuleItem,
    // BasecoreUpgradeApi). Required at runtime for the base heating feature.
    compileOnly files("D:/MODS/1.21.1/basecore-template-1.21.1/build/libs/basecore-1.0.4.jar")

    // Cold Sweat: compile-only for TempModifier API (BaseHeatModifier).
    compileOnly files("D:/MODS/1.21.1/timexrebirth-template-1.21.1/run/mods/[冷汗] ColdSweat-2.4.2.jar")

    // 原生 HUD 依赖模组：编译期引用原生 HUD 隐藏 Mixin 的目标类，运行时须已加载。
    // RealityValue: PlayerExHudRenderer (原生理智/健康 HUD)
    compileOnly files("D:/MODS/1.21.1/timexrebirth-template-1.21.1/run/mods/reality_value-1.21.1-1.0.1.jar")
    // ThirstWasTaken: ThirstBarRenderer (原生口渴 HUD)
    compileOnly files("D:/MODS/1.21.1/timexrebirth-template-1.21.1/run/mods/[口渴] ThirstWasTaken-1.21.1-2.1.5.jar")
    // Immersive Aircraft: NeoForgeOverlayRenderer (原生耐久/引擎 HUD)
    compileOnly files("D:/MODS/已构建/[沉浸式飞机] immersive_aircraft-1.4.6+1.21.1-neoforge.jar")
    // NumismaticOverhaul: CurrencyHolder 仅反射读取，不需要编译期依赖

    // Create: compile-only for the fireproof casing connected-texture mechanism
    // (CTModel / CTSpriteShifter / EncasedCTBehaviour). Required at runtime.
    compileOnly files("D:/MODS/已构建/[机械动力] create-1.21.1-6.0.10.jar")

    // FarmersDelight: compile-only for the cooking pot temperature preservation mixin
    // (CookingPotBlockEntity). Optional at runtime (gated by TimeXMixinPlugin).
    compileOnly files("D:/MODS/1.21.1/timexrebirth-template-1.21.1/run/mods/[农夫乐事] FarmersDelight-1.21.1-1.3.2.jar")

    // JEI: compile-only for the drawing table recipe category (DrawingJeiPlugin).
    // The plugin class is only loaded by JEI's scanner when JEI is present at runtime.
    compileOnly files("D:/MODS/已构建/jei-1.21.1-neoforge-19.44.0.403.jar")

    // EMI: compile-only for the drawing table recipe category (DrawingEmiPlugin).
    // The plugin class is only loaded by EMI's entrypoint scanner when EMI is present at runtime.
    compileOnly files("D:/MODS/1.21.1/timexrebirth-template-1.21.1/run/mods/emi-1.1.24+1.21.1+neoforge.jar")
}

// Catnip (net.createmod.catnip) 与 Registrate (com.tterrag.registrate) 打包在 Create jar 的嵌套 jar 内：
// - CTSpriteShiftEntry 的父类 SpriteShiftEntry 来自 catnip（ponder jar）
// - CustomBlockModels.register 的参数类型 NonNullFunction 来自 Registrate
// 分别提取出来供编译。
def ponderJarPath = file("build/tmp/create-nested/META-INF/jarjar/ponder-neoforge-1.0.82+mc1.21.1.jar")
def registrateJarPath = file("build/tmp/create-nested/META-INF/jarjar/Registrate-MC1.21-1.3.0+67.jar")
tasks.register('extractCreateNestedJars', Copy) {
    from zipTree(file("D:/MODS/已构建/[机械动力] create-1.21.1-6.0.10.jar"))
    include 'META-INF/jarjar/ponder-neoforge-1.0.82+mc1.21.1.jar'
    include 'META-INF/jarjar/Registrate-MC1.21-1.3.0+67.jar'
    into file("build/tmp/create-nested")
}
sourceSets.main.compileClasspath += files(ponderJarPath, registrateJarPath)
tasks.named('compileJava').configure {
    dependsOn 'extractCreateNestedJars'
}

// Create numismaticoverhaul jar from pre-compiled classes in resources directory
// This jar is used as compile-time stub only, NOT as a runtime mod
def numismaticJarPath = file("build/tmp/numismaticoverhaul-1.21.1-2.0.1.jar")
tasks.register('createNumismaticJar', Jar) {
    destinationDirectory = file('build/tmp')
    archiveFileName = 'numismaticoverhaul-1.21.1-2.0.1.jar'
    from('numismaticoverhaul/numismaticoverhaul-逆向/src/main/resources') {
        exclude 'META-INF/**'  // Exclude mods.toml so it won't be loaded as a mod
    }
    duplicatesStrategy = 'EXCLUDE'
}

// Only add to compile classpath, NOT runtime classpath
// This ensures NumismaticOverhaul classes are available for compilation
// but the JAR won't be loaded as a mod at runtime
sourceSets.main.compileClasspath += files(numismaticJarPath)

tasks.named('compileJava').configure {
    dependsOn 'createNumismaticJar'
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    filteringCharset = 'UTF-8'
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            // 中文显示名必须用 Groovy 字面量硬编码：gradle.properties 被 Java Properties
            // 按 Latin-1 读取，含中文的值会乱码（参考 realityvalue 的处理方式）
            mod_name               : 'TimeX：重获新生',
            mod_license            : mod_license,
            mod_version            : mod_version,
            // cm_plugins properties
            cm_plugins_id          : project.cm_plugins_id,
            cm_plugins_name        : 'createmeow的插件',
            cm_plugins_version     : project.cm_plugins_version,
            // night_vision_device properties
            night_vision_device_id     : project.night_vision_device_id,
            night_vision_device_name   : '夜视镜',
            night_vision_device_version: project.night_vision_device_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
